name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options:
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]

    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: django-insecure-wlgjuo53y49%-4y5(!%ksylle_ud%b=7%__@9hh+@$d%_^y3s!
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: cache deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv export --no-hashes --all-extras --no-emit-project > requirements.txt
          uv pip install --system --no-cache -r requirements.txt

      - name: Run Tests
        run: pytest

  # Mirrors the `deploy` target in the Makefile: build the commit, point the
  # jobs at it, migrate, then roll the service forward. Only pushes to main
  # deploy, and only after the tests above pass.
  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two overlapping deploys would race the migration job against the older
    # revision still serving traffic, so they queue instead of cancelling.
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write  # required to mint the OIDC token for Workload Identity

    env:
      PROJECT_ID: qadam-learning-platform
      REGION: europe-west1
      IMAGE: europe-west1-docker.pkg.dev/qadam-learning-platform/qadam-containers/backend
      SERVICE: qadam-api
      JOBS: qadam-migrate qadam-create-admin qadam-blueprint-maintenance
      # Worker pools are their own resource kind -- `gcloud run services list`
      # does not show them, which is how this one sat on an Aug-30 image while
      # the service rolled forward. It ships in the same image as the service.
      WORKER: qadam-celery-worker

    steps:
      - uses: actions/checkout@v6

      - name: Tag with the short SHA, matching `make deploy`
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/938833319095/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@qadam-learning-platform.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point jobs at the new image
        run: |
          for job in $JOBS; do
            gcloud run jobs update "$job" \
              --region="$REGION" \
              --image="$IMAGE:${{ steps.vars.outputs.sha }}"
          done

      - name: Migrate before the new code serves traffic
        run: gcloud run jobs execute qadam-migrate --region="$REGION" --wait

      # --min-instances keeps one instance resident so a request arriving after
      # an idle period does not pay for container start plus the Django import
      # tree. It is per-revision, so it has to be set on every rollout.
      - name: Roll out the service
        run: |
          gcloud run deploy "$SERVICE" \
            --region="$REGION" \
            --image="$IMAGE:${{ steps.vars.outputs.sha }}" \
            --min-instances=1

      # After the service, so a task enqueued by the new web code is never
      # picked up by a worker still running the old image.
      - name: Roll out the Celery worker pool
        run: |
          gcloud run worker-pools update "$WORKER" \
            --region="$REGION" \
            --image="$IMAGE:${{ steps.vars.outputs.sha }}"
